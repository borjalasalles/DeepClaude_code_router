[project]
name = "deep-devops"
version = "0.0.1"
description = "Open-source coding agent on deepagents. DeepSeek V4 via Nebius EU primary; Claude Haiku/Sonnet escalation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jgarcial" }]

dependencies = [
    "deepagents",
    "langchain-openai",
    "langchain-anthropic",
    "python-dotenv",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
